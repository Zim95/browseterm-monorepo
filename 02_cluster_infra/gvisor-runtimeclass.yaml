# RuntimeClass that maps the name `gvisor` (used by container-maker's USER_POD_RUNTIME_CLASS) to the
# `runsc` containerd runtime handler that setup.k3s.sh registers on the node. This is a BUILT-IN k8s
# resource (node.k8s.io/v1) — just a name→handler map, NOT a CRD/controller. A user pod opts in via
# `runtimeClassName: gvisor`; the image is unchanged, only which runtime executes it. Applying this
# without runsc installed on the node is harmless (pods that reference it just won't schedule), which
# is why the node-side install (setup.k3s.sh) and this cluster resource are kept in lockstep.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
