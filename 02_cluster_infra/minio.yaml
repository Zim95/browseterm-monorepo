# MinIO (S3-compatible object storage) for BrowseTerm container snapshots.
#
# Deploy:   kubectl apply -f 02_cluster_infra/minio.yaml
# Namespace: browseterm. API on :9000 (svc minio-service), console on :9001.
# browseterm-storage (MinioStorage) connects to minio-service:9000 with these root creds.
# The bucket is created by the minio-createbucket Job (MinioStorage does not auto-create it).
#
# ⚠️ DEV credentials below (minioadmin/minioadmin123). For production, replace with a
#    real Secret (and ideally scoped access keys), not hardcoded values in this manifest.
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: browseterm
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin123
  MINIO_BUCKET: browseterm-snapshots
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: browseterm
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: browseterm
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        # quay.io/minio/minio:latest now returns 401 Unauthorized even for anonymous manifest
        # reads (confirmed 2026-09-25 - MinIO gated their official quay.io images behind auth;
        # Docker Hub's minio/minio was already gone entirely per this file's own history). Using
        # Bitnami's legacy free-tier mirror instead - it deliberately keeps the exact same
        # MINIO_ROOT_USER/MINIO_ROOT_PASSWORD env vars and `server ... --console-address` CLI as
        # upstream, so nothing else in this manifest needs to change. Pinned to a real tag, not
        # :latest, since bitnamilegacy is itself a frozen/legacy catalog (no new "latest" is
        # coming) - a moving target here would gain nothing and only risks another silent break.
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        args: ["server", "/data", "--console-address", ":9001"]
        # Bitnami images run as a non-root UID by default (1001), unlike the official
        # quay.io/minio/minio image this replaced (which ran as root) - the existing minio-pvc's
        # on-disk data is root-owned from that image, so the Bitnami entrypoint's own non-root
        # user gets "file access denied" writing to /data/.minio.sys/tmp. Forcing root here
        # matches the original image's behavior exactly, no PVC ownership change needed.
        securityContext:
          runAsUser: 0
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-creds
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-creds
              key: MINIO_ROOT_PASSWORD
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: browseterm
spec:
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
---
# Creates the snapshots bucket once MinIO is up (MinioStorage does not auto-create it).
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-createbucket
  namespace: browseterm
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 300   # auto-remove the completed bucket-create pod 5 min after it finishes
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: createbucket
        # Same reason as the minio Deployment's own image comment above - quay.io/minio/mc now
        # 401s too.
        image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-creds
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-creds
              key: MINIO_ROOT_PASSWORD
        - name: MINIO_BUCKET
          valueFrom:
            secretKeyRef:
              name: minio-creds
              key: MINIO_BUCKET
        command:
        - /bin/sh
        - -c
        - |
          set -e
          until mc alias set local http://minio-service:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
            echo "waiting for minio..."; sleep 2
          done
          mc mb --ignore-existing "local/$MINIO_BUCKET"
          mc ls local
          echo "bucket ready: $MINIO_BUCKET"
